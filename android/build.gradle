buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    afterEvaluate { proj ->
        if (proj.plugins.hasPlugin('com.android.library')) {
            if (!proj.android.namespace) {
                def manifestFile = proj.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def packageName = new XmlParser().parse(manifestFile).@package
                    if (packageName) {
                        proj.android.namespace = packageName
                    }
                }
            }
        }
    }
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
